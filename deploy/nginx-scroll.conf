# /etc/nginx/sites-available/scroll.ezeangeloni.xyz
#
# Static Astro site served from /var/www/scroll.ezeangeloni.xyz/html/
# SSL added afterwards by `certbot --nginx -d scroll.ezeangeloni.xyz`
# (certbot edits this file in place to add listen 443 + cert paths).
#
# Mirror of the pattern used for ezeangeloni.xyz (the eze landing).

server {
    listen 80;
    listen [::]:80;
    server_name scroll.ezeangeloni.xyz;

    root /var/www/scroll.ezeangeloni.xyz/html;
    index index.html;

    # Astro outputs pretty URLs by default (e.g. /about → /about/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Aggressive cache for fingerprinted assets (Astro hashes filenames)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Short cache for HTML — content can change between deploys
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Gzip text assets (nginx already gzips by default; this is explicit)
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Block hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
